<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Telegram Comments Importer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=20260623-1">
  <script defer src="{{ url_for('static', path='/app.js') }}?v=20260623-1"></script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/overview">
      <span class="brand-mark">T</span>
      <span><strong>Telegram Importer</strong><small>local read-only workspace</small></span>
    </a>
    <nav>
      <a href="/overview">Обзор</a>
      <a href="/">Парсинг</a>
      <a href="/settings">Настройки</a>
      <span class="local-pill"><i></i> 127.0.0.1</span>
    </nav>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer>Данные, credentials и Telegram session остаются на этом компьютере.</footer>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
