<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Telegram Comments Importer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=20260927-4">
  <script defer src="{{ url_for('static', path='/app.js') }}?v=20260927-2"></script>
  <script defer src="{{ url_for('static', path='/footer-wave.js') }}?v=20260926-4"></script>
  <script defer src="{{ url_for('static', path='/ui-copy.js') }}?v=20260927-1"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="topbar">
    <a class="brand" href="/overview">
      <span>parser</span>
    </a>
    <nav aria-label="Основная навигация">
      <a href="/overview" {% if request.url.path == '/overview' %}aria-current="page"{% endif %}>(обзор)</a>
      <a href="/" {% if request.url.path != '/overview' and request.url.path != '/settings' %}aria-current="page"{% endif %}>(парсинг)</a>
      <a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>(настройки)</a>
    </nav>
  </header>
  <main class="shell" id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <canvas class="footer-wave" aria-hidden="true" width="1600" height="190"></canvas>
  </footer>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
